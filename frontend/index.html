<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perovskite Cathode Screening – NGIT</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="hidden"><form id="lf" class="card login"><div class="logo-lg">⬡</div><h1>Perovskite Cathode Screening</h1>
<p class="muted">ML screening of ABO₃ cathodes for low-temperature SOFCs · NGIT</p>
<label>Roll Number<input id="roll" autocomplete="username" placeholder="e.g. 23CSE001" required></label>
<label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
<div id="lerr" class="err"></div><button class="btn">Log in</button><div class="foot">Neil Gogte Institute of Technology · Machine-learning screening for low-temperature SOFC cathodes</div></form></div>
<div id="app" class="hidden"><aside><div class="brand"><span class="logo">⬡</span><div>Cathode Screening<small>SOFC · NGIT</small></div></div><nav id="nav"></nav>
<div class="who"><span id="who"></span><button class="link" id="logout">Log out</button></div></aside>
<div class="wrap"><div id="bar"></div><main id="main"></main></div></div>
<div id="busy" class="hidden"><div class="spin"></div><div id="busymsg"></div></div>
<div id="modal" class="hidden"><div class="mbox"><button class="x" id="mx">×</button><div id="mbody"></div></div></div>
<div id="toast"></div><script src="app.js"></script></body></html>
